# Alembic configuration for MailAccess.
#
# This file supports STANDALONE use of the `alembic` CLI (e.g. `alembic upgrade
# head`, `alembic downgrade -1`, `alembic history`) during development and in the
# migration tests. At application startup, migrations are applied
# programmatically by `backend.db.database.init_db`, which builds its own Config
# and shares the app's live connection — it does not read this file.
#
# `sqlalchemy.url` is intentionally left blank: env.py falls back to the app's
# configured `settings.database_url` (DATABASE_URL / the default SQLite path) so
# the CLI targets the same database as the app without duplicating the URL here.
# Override per-invocation with `-x` or by setting DATABASE_URL.

[alembic]
script_location = backend/db/migrations
prepend_sys_path = .
# Blank -> env.py uses settings.database_url. Async driver required (see .env.example).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
